services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mock_interview
      POSTGRES_USER: mock_interview
      POSTGRES_PASSWORD: mock_interview
    ports:
      - "5432:5432"
    volumes:
      - mock_interview_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mock_interview"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/mock_interview
      DATABASE_USER: mock_interview
      DATABASE_PASSWORD: mock_interview
      ANTHROPIC_API_KEY:
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      USE_FAKE_AI:

volumes:
  mock_interview_db:
